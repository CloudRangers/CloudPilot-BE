# --- Package Install Result (Worker ? WAS) ---
rabbitmq.queue.package-install-result.name=package-install-results
rabbitmq.exchange.package-install-result.name=package-install-result-exchange
rabbitmq.routing-key.package-install-result.pattern=package.install.result
