spring.application.name=cloudpilot

# --- Datasource ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cloudpilot}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.config.import=optional:file:.env[.properties]

# --- HikariCP ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# --- JPA/Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul
spring.jackson.default-property-inclusion=non_null

# --- Logging ---
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=info
logging.level.org.springframework.security=DEBUG
logging.level.com.cloudrangers.cloudpilot.ops.service=DEBUG

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

spring.rabbitmq.listener.simple.auto-startup=true

# === exchange / queue / routing-key ===

rabbitmq.exchange.provision.name=provision-exchange
rabbitmq.exchange.result.name=result-exchange
rabbitmq.exchange.dlx.name=provision-dlx

rabbitmq.queue.provision.name=provision-jobs
rabbitmq.queue.result.name=provision-results
rabbitmq.queue.dlq.name=provision-jobs-dlq

rabbitmq.routing-key.provision=provision.#
rabbitmq.routing-key.result=result.provision.#
rabbitmq.routing-key.dlq=provision.dlq
rabbitmq.routing-key.result.pattern=#

rabbitmq.dlx.exchange=${rabbitmq.exchange.dlx.name}
rabbitmq.dlx.queue=${rabbitmq.queue.dlq.name}

rabbitmq.queue.package.name=package-install-jobs
rabbitmq.exchange.package.name=package-install-exchange
rabbitmq.routing-key.package=package.install

# JWT
jwt.secret=${JWT_SECRET:change-me-jwt-secret}

## --- Actuator / Prometheus ---
# ?? actuator ?????? ??? ????
management.endpoints.web.exposure.include=health,info,prometheus

# health ?????? ?? ??? (??)
management.endpoint.health.show-details=always

# Micrometer Prometheus export ???
management.prometheus.metrics.export.enabled=true

# (??) ?????? ?? ?? ???? ???
management.metrics.tags.application=cloudpilot


# --- Package Install Result (Worker ? WAS) ---
rabbitmq.queue.package-install-result.name=package-install-results
rabbitmq.exchange.package-install-result.name=package-install-result-exchange
rabbitmq.routing-key.package-install-result.pattern=package-install-result.*

# --- Monitoring / Prometheus ---
monitoring.prometheus.base-url=${MONITORING_PROM_BASE_URL:http://172.16.5.68:30090}
monitoring.prometheus.up-query=${MONITORING_PROM_UP_QUERY:up}
monitoring.prometheus.default-range-minutes=${MONITORING_PROM_DEFAULT_RANGE:60}
monitoring.prometheus.default-step-seconds=${MONITORING_PROM_DEFAULT_STEP:60}

# =========================
# vCenter API ??
# =========================
vcenter.base-url=${VCENTER_BASE_URL:https://172.16.0.100/api}
vcenter.username=${VCENTER_USERNAME:administrator@fisa.ce5}
vcenter.password=${VCENTER_PASSWORD:VMware1!}

# --- Package Install Progress (SSE?) ---
rabbitmq.queue.package-install-progress.name=${PACKAGE_INSTALL_PROGRESS_QUEUE:package-install-progress}
rabbitmq.exchange.package-install-progress.name=${PACKAGE_INSTALL_PROGRESS_EXCHANGE:package-install-progress-exchange}
rabbitmq.routing-key.package-install-progress.pattern=${PACKAGE_INSTALL_PROGRESS_ROUTING_KEY:package.install.progress}
