spring.application.name=cloudpilot

# --- Datasource (???? ??) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cloudpilot}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${DB_PASSWORD}}

# --- HikariCP (??: ?? ? ??) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# --- Logging (??? ?? ??: ??? trace? ?? ? ?) ---
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=info

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}

# ?? ???? ??? ?? ?? ?? (??? false?)
spring.rabbitmq.listener.simple.auto-startup=true

# === ???: exchange / queue / routing-key ===
rabbitmq.exchange.provision.name=provision-exchange
rabbitmq.exchange.result.name=result-exchange
rabbitmq.exchange.dlx.name=provision-dlx

rabbitmq.queue.provision.name=provision-jobs
rabbitmq.queue.result.name=provision-results
rabbitmq.queue.dlq.name=provision-jobs-dlq

rabbitmq.routing-key.provision=provision.#
rabbitmq.routing-key.result=result.provision.#
rabbitmq.routing-key.dlq=provision.dlq

# (?? alias) ?? ??? ?? ?? ????? ?? ? ??
rabbitmq.dlx.exchange=${rabbitmq.exchange.dlx.name}
rabbitmq.dlx.queue=${rabbitmq.queue.dlq.name}

rabbitmq.queue.package-install.name=package-install-jobs
rabbitmq.exchange.package-install.name=package-install-exchange
rabbitmq.routing-key.package-install.pattern=package.install.#

